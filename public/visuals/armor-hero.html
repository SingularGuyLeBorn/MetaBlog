<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armor Hero</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a0f1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00aaff;
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulse 1.5s ease-in-out infinite;
            z-index: 100;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 50;
        }
        .btn {
            width: 44px;
            height: 44px;
            border: 1px solid rgba(0, 170, 255, 0.4);
            background: rgba(15, 20, 35, 0.7);
            color: #00aaff;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        .btn:hover {
            background: rgba(0, 170, 255, 0.2);
            border-color: #00aaff;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.3);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .title {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00aaff;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
            z-index: 50;
        }
        .energy-bar {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 200px;
            height: 6px;
            background: rgba(0, 170, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            z-index: 50;
        }
        .energy-fill {
            height: 100%;
            width: 75%;
            background: linear-gradient(90deg, #00aaff, #00ffff);
            animation: energyPulse 2s ease-in-out infinite;
        }
        @keyframes energyPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .energy-label {
            position: absolute;
            bottom: 40px;
            left: 30px;
            color: #00aaff;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 50;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="canvas-container">
        <div id="loading">Initializing...</div>
        <div class="title">Armor Hero</div>
        <div class="energy-label">Core Energy</div>
        <div class="energy-bar">
            <div class="energy-fill"></div>
        </div>
        <div class="controls">
            <button class="btn" id="resetBtn" title="Reset View">⟲</button>
            <button class="btn" id="fullscreenBtn" title="Fullscreen">⛶</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0f1a);
        scene.fog = new THREE.FogExp2(0x0a0f1a, 0.02);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 8;
        controls.maxDistance = 30;
        controls.maxPolarAngle = Math.PI / 1.8;
        controls.target.set(0, 1, 0);

        // Armor group
        const armorGroup = new THREE.Group();
        scene.add(armorGroup);

        // Materials
        const armorMaterial = new THREE.MeshStandardMaterial({
            color: 0x2a3a4a,
            metalness: 0.9,
            roughness: 0.3,
            emissive: 0x051020,
            emissiveIntensity: 0.2
        });

        const jointMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1a2e,
            metalness: 0.7,
            roughness: 0.6
        });

        const highlightMaterial = new THREE.MeshStandardMaterial({
            color: 0x4a5a6a,
            metalness: 0.95,
            roughness: 0.2,
            emissive: 0x0a1a2a,
            emissiveIntensity: 0.3
        });

        // Energy core material (glowing)
        const coreMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                color: { value: new THREE.Color(0x00aaff) }
            },
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vNormal;
                void main() {
                    vUv = uv;
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec3 color;
                varying vec2 vUv;
                varying vec3 vNormal;
                void main() {
                    float pulse = sin(time * 3.0) * 0.3 + 0.7;
                    float fresnel = pow(1.0 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                    vec3 glow = color * pulse * (1.0 + fresnel * 2.0);
                    gl_FragColor = vec4(glow, 0.9);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending
        });

        // Energy line material
        const energyLineMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                varying vec2 vUv;
                void main() {
                    float flow = fract(vUv.x * 5.0 - time * 2.0);
                    float intensity = smoothstep(0.0, 0.3, flow) * smoothstep(1.0, 0.7, flow);
                    gl_FragColor = vec4(0.0, 0.67, 1.0, intensity * 0.8);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending
        });

        // ===== HELMET =====
        const helmetGroup = new THREE.Group();
        helmetGroup.position.y = 3.2;
        armorGroup.add(helmetGroup);

        // Main helmet shape
        const helmetGeo = new THREE.BoxGeometry(1.4, 1.6, 1.5);
        const helmet = new THREE.Mesh(helmetGeo, armorMaterial);
        helmetGroup.add(helmet);

        // Helmet top ridge
        const helmetRidgeGeo = new THREE.BoxGeometry(0.3, 0.4, 1.6);
        const helmetRidge = new THREE.Mesh(helmetRidgeGeo, highlightMaterial);
        helmetRidge.position.y = 0.8;
        helmetGroup.add(helmetRidge);

        // Side guards
        const sideGuardGeo = new THREE.BoxGeometry(0.3, 1, 0.8);
        const leftGuard = new THREE.Mesh(sideGuardGeo, armorMaterial);
        leftGuard.position.set(-0.8, -0.2, 0.2);
        helmetGroup.add(leftGuard);

        const rightGuard = new THREE.Mesh(sideGuardGeo, armorMaterial);
        rightGuard.position.set(0.8, -0.2, 0.2);
        helmetGroup.add(rightGuard);

        // Visor slit (glowing)
        const visorGeo = new THREE.PlaneGeometry(1, 0.15);
        const visorMat = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff,
            side: THREE.DoubleSide
        });
        const visor = new THREE.Mesh(visorGeo, visorMat);
        visor.position.set(0, 0.1, 0.76);
        helmetGroup.add(visor);

        // ===== TORSO =====
        const torsoGroup = new THREE.Group();
        torsoGroup.position.y = 1.5;
        armorGroup.add(torsoGroup);

        // Chest plate
        const chestGeo = new THREE.BoxGeometry(2.2, 2.5, 1.2);
        const chest = new THREE.Mesh(chestGeo, armorMaterial);
        torsoGroup.add(chest);

        // Chest highlight plates
        const chestPlateGeo = new THREE.BoxGeometry(0.8, 1.2, 0.1);
        const leftChestPlate = new THREE.Mesh(chestPlateGeo, highlightMaterial);
        leftChestPlate.position.set(-0.5, 0.3, 0.65);
        torsoGroup.add(leftChestPlate);

        const rightChestPlate = new THREE.Mesh(chestPlateGeo, highlightMaterial);
        rightChestPlate.position.set(0.5, 0.3, 0.65);
        torsoGroup.add(rightChestPlate);

        // ENERGY CORE (center chest)
        const coreGeo = new THREE.CircleGeometry(0.35, 32);
        const core = new THREE.Mesh(coreGeo, coreMaterial);
        core.position.set(0, 0.2, 0.66);
        torsoGroup.add(core);

        // Core ring
        const coreRingGeo = new THREE.RingGeometry(0.4, 0.45, 32);
        const coreRing = new THREE.Mesh(coreRingGeo, energyLineMaterial);
        coreRing.position.set(0, 0.2, 0.67);
        torsoGroup.add(coreRing);

        // Abdomen
        const abdomenGeo = new THREE.BoxGeometry(1.6, 1.2, 0.9);
        const abdomen = new THREE.Mesh(abdomenGeo, jointMaterial);
        abdomen.position.y = -1.8;
        torsoGroup.add(abdomen);

        // Energy lines on torso
        const energyLineGeo = new THREE.PlaneGeometry(0.05, 2);
        const leftEnergyLine = new THREE.Mesh(energyLineGeo, energyLineMaterial);
        leftEnergyLine.position.set(-0.7, 0, 0.61);
        torsoGroup.add(leftEnergyLine);

        const rightEnergyLine = new THREE.Mesh(energyLineGeo, energyLineMaterial);
        rightEnergyLine.position.set(0.7, 0, 0.61);
        torsoGroup.add(rightEnergyLine);

        // ===== SHOULDERS =====
        const shoulderGeo = new THREE.BoxGeometry(1.2, 1, 1);
        
        const leftShoulder = new THREE.Mesh(shoulderGeo, highlightMaterial);
        leftShoulder.position.set(-1.6, 2.5, 0);
        armorGroup.add(leftShoulder);

        const rightShoulder = new THREE.Mesh(shoulderGeo, highlightMaterial);
        rightShoulder.position.set(1.6, 2.5, 0);
        armorGroup.add(rightShoulder);

        // Shoulder energy accents
        const shoulderAccentGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.1, 16);
        const leftShoulderAccent = new THREE.Mesh(shoulderAccentGeo, coreMaterial);
        leftShoulderAccent.rotation.x = Math.PI / 2;
        leftShoulderAccent.position.set(-1.6, 2.5, 0.55);
        armorGroup.add(leftShoulderAccent);

        const rightShoulderAccent = new THREE.Mesh(shoulderAccentGeo, coreMaterial);
        rightShoulderAccent.rotation.x = Math.PI / 2;
        rightShoulderAccent.position.set(1.6, 2.5, 0.55);
        armorGroup.add(rightShoulderAccent);

        // ===== ARMS =====
        // Upper arms
        const upperArmGeo = new THREE.BoxGeometry(0.7, 1.8, 0.8);
        
        const leftUpperArm = new THREE.Mesh(upperArmGeo, armorMaterial);
        leftUpperArm.position.set(-1.6, 1.2, 0);
        armorGroup.add(leftUpperArm);

        const rightUpperArm = new THREE.Mesh(upperArmGeo, armorMaterial);
        rightUpperArm.position.set(1.6, 1.2, 0);
        armorGroup.add(rightUpperArm);

        // Elbow joints
        const elbowGeo = new THREE.SphereGeometry(0.4, 16, 16);
        
        const leftElbow = new THREE.Mesh(elbowGeo, jointMaterial);
        leftElbow.position.set(-1.6, 0.2, 0);
        armorGroup.add(leftElbow);

        const rightElbow = new THREE.Mesh(elbowGeo, jointMaterial);
        rightElbow.position.set(1.6, 0.2, 0);
        armorGroup.add(rightElbow);

        // Forearms
        const forearmGeo = new THREE.BoxGeometry(0.6, 1.6, 0.7);
        
        const leftForearm = new THREE.Mesh(forearmGeo, highlightMaterial);
        leftForearm.position.set(-1.6, -0.8, 0.1);
        leftForearm.rotation.x = -0.2;
        armorGroup.add(leftForearm);

        const rightForearm = new THREE.Mesh(forearmGeo, highlightMaterial);
        rightForearm.position.set(1.6, -0.8, 0.1);
        rightForearm.rotation.x = -0.2;
        armorGroup.add(rightForearm);

        // Gauntlets
        const gauntletGeo = new THREE.BoxGeometry(0.7, 0.8, 0.8);
        
        const leftGauntlet = new THREE.Mesh(gauntletGeo, armorMaterial);
        leftGauntlet.position.set(-1.6, -1.8, 0.2);
        armorGroup.add(leftGauntlet);

        const rightGauntlet = new THREE.Mesh(gauntletGeo, armorMaterial);
        rightGauntlet.position.set(1.6, -1.8, 0.2);
        armorGroup.add(rightGauntlet);

        // ===== LEGS =====
        // Thighs
        const thighGeo = new THREE.BoxGeometry(0.9, 1.8, 1);
        
        const leftThigh = new THREE.Mesh(thighGeo, armorMaterial);
        leftThigh.position.set(-0.7, -2.8, 0);
        armorGroup.add(leftThigh);

        const rightThigh = new THREE.Mesh(thighGeo, armorMaterial);
        rightThigh.position.set(0.7, -2.8, 0);
        armorGroup.add(rightThigh);

        // Knee guards
        const kneeGeo = new THREE.BoxGeometry(1, 0.8, 0.6);
        
        const leftKnee = new THREE.Mesh(kneeGeo, highlightMaterial);
        leftKnee.position.set(-0.7, -4, 0.4);
        armorGroup.add(leftKnee);

        const rightKnee = new THREE.Mesh(kneeGeo, highlightMaterial);
        rightKnee.position.set(0.7, -4, 0.4);
        armorGroup.add(rightKnee);

        // Knee energy
        const kneeEnergyGeo = new THREE.CircleGeometry(0.15, 16);
        const leftKneeEnergy = new THREE.Mesh(kneeEnergyGeo, coreMaterial);
        leftKneeEnergy.position.set(-0.7, -4, 0.71);
        armorGroup.add(leftKneeEnergy);

        const rightKneeEnergy = new THREE.Mesh(kneeEnergyGeo, coreMaterial);
        rightKneeEnergy.position.set(0.7, -4, 0.71);
        armorGroup.add(rightKneeEnergy);

        // Shins
        const shinGeo = new THREE.BoxGeometry(0.7, 1.8, 0.8);
        
        const leftShin = new THREE.Mesh(shinGeo, armorMaterial);
        leftShin.position.set(-0.7, -5.2, 0.1);
        armorGroup.add(leftShin);

        const rightShin = new THREE.Mesh(shinGeo, armorMaterial);
        rightShin.position.set(0.7, -5.2, 0.1);
        armorGroup.add(rightShin);

        // Boots
        const bootGeo = new THREE.BoxGeometry(0.8, 0.6, 1.2);
        
        const leftBoot = new THREE.Mesh(bootGeo, jointMaterial);
        leftBoot.position.set(-0.7, -6.4, 0.3);
        armorGroup.add(leftBoot);

        const rightBoot = new THREE.Mesh(bootGeo, jointMaterial);
        rightBoot.position.set(0.7, -6.4, 0.3);
        armorGroup.add(rightBoot);

        // ===== BACKPACK / THRUSTERS =====
        const backpackGeo = new THREE.BoxGeometry(1.6, 2, 0.8);
        const backpack = new THREE.Mesh(backpackGeo, armorMaterial);
        backpack.position.set(0, 1.5, -1);
        armorGroup.add(backpack);

        // Thruster nozzles
        const thrusterGeo = new THREE.CylinderGeometry(0.3, 0.2, 0.6, 16);
        const thrusterMat = new THREE.MeshBasicMaterial({ color: 0x0088ff });
        
        const leftThruster = new THREE.Mesh(thrusterGeo, thrusterMat);
        leftThruster.rotation.x = Math.PI / 2;
        leftThruster.position.set(-0.4, 1, -1.5);
        armorGroup.add(leftThruster);

        const rightThruster = new THREE.Mesh(thrusterGeo, thrusterMat);
        rightThruster.rotation.x = Math.PI / 2;
        rightThruster.position.set(0.4, 1, -1.5);
        armorGroup.add(rightThruster);

        // ===== ENERGY PARTICLES =====
        const particleCount = 300;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        const particleData = [];

        for (let i = 0; i < particleCount; i++) {
            // Emit from core area
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * 3;
            particlePos[i * 3] = Math.cos(angle) * radius;
            particlePos[i * 3 + 1] = 1 + (Math.random() - 0.5) * 4;
            particlePos[i * 3 + 2] = Math.sin(angle) * radius + 1;
            
            particleData.push({
                angle: angle,
                radius: radius,
                speed: 0.5 + Math.random() * 1,
                yOffset: Math.random() * Math.PI * 2
            });
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));

        const particleMat = new THREE.PointsMaterial({
            color: 0x00ffff,
            size: 0.08,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(particleGeo, particleMat);
        armorGroup.add(particles);

        // ===== LIGHTING =====
        const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xaaccff, 1);
        mainLight.position.set(5, 10, 7);
        scene.add(mainLight);

        const rimLight = new THREE.DirectionalLight(0x0088ff, 0.8);
        rimLight.position.set(-5, 5, -5);
        scene.add(rimLight);

        const coreLight = new THREE.PointLight(0x00aaff, 2, 10);
        coreLight.position.set(0, 1.5, 2);
        scene.add(coreLight);

        // Hide loading spinner
        document.getElementById('loading').style.display = 'none';

        // Animation
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();

            // Update shader uniforms
            coreMaterial.uniforms.time.value = time;
            energyLineMaterial.uniforms.time.value = time;

            // Gentle breathing animation
            const breath = Math.sin(time * 1.5) * 0.03;
            torsoGroup.scale.set(1 + breath, 1 + breath * 0.5, 1 + breath);

            // Subtle floating
            armorGroup.position.y = Math.sin(time * 0.8) * 0.1;

            // Animate particles
            const positions = particles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                const data = particleData[i];
                
                // Spiral upward motion
                data.angle += data.speed * 0.02;
                const y = 1 + Math.sin(time + data.yOffset) * 2 + (Math.sin(time * data.speed) * 0.5);
                
                positions[i * 3] = Math.cos(data.angle) * data.radius;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = Math.sin(data.angle) * data.radius + 1;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            // Rotate core ring
            coreRing.rotation.z = time * 0.5;

            // Pulse core light
            coreLight.intensity = 1.5 + Math.sin(time * 3) * 0.5;

            // Subtle arm rotation
            leftUpperArm.rotation.z = 0.1 + Math.sin(time * 0.5) * 0.05;
            rightUpperArm.rotation.z = -0.1 - Math.sin(time * 0.5 + 1) * 0.05;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Controls
        document.getElementById('resetBtn').addEventListener('click', () => {
            camera.position.set(0, 2, 16);
            controls.target.set(0, 1, 0);
            controls.update();
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

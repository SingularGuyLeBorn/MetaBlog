<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmos 宇宙 - Solar System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
    canvas { display: block; }
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a0a0c0;
      font-family: sans-serif;
      background: #0a0a0f;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(100, 150, 255, 0.2);
      border-top-color: #6496ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .controls {
      position: absolute;
      bottom: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .control-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: rgba(30, 35, 50, 0.8);
      color: #e0e0f0;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }
    .control-btn:hover { background: rgba(50, 60, 90, 0.9); }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <span>加载 3D 场景中...</span>
  </div>
  <div id="canvas-container"></div>
  <div class="controls">
    <button class="control-btn" onclick="resetView()" title="重置视角">⟲</button>
    <button class="control-btn" onclick="toggleFullscreen()" title="全屏">⛶</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const container = document.getElementById('canvas-container');
    const width = window.innerWidth;
    const height = window.innerHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050508);
    scene.fog = new THREE.FogExp2(0x050508, 0.002);

    const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
    camera.position.set(0, 40, 80);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const ambientLight = new THREE.AmbientLight(0x333333, 0.3);
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffaa00, 2, 300);
    sunLight.position.set(0, 0, 0);
    scene.add(sunLight);

    // Sun
    const sunGeometry = new THREE.SphereGeometry(5, 32, 32);
    const sunMaterial = new THREE.MeshBasicMaterial({ 
      color: 0xffaa00,
      emissive: 0xff6600,
      emissiveIntensity: 0.5
    });
    const sun = new THREE.Mesh(sunGeometry, sunMaterial);
    scene.add(sun);

    // Sun glow
    const glowGeometry = new THREE.SphereGeometry(6.5, 32, 32);
    const glowMaterial = new THREE.MeshBasicMaterial({
      color: 0xff6600,
      transparent: true,
      opacity: 0.3,
      side: THREE.BackSide
    });
    const sunGlow = new THREE.Mesh(glowGeometry, glowMaterial);
    scene.add(sunGlow);

    // Planets data
    const planets = [
      { name: 'Mercury', color: 0x8c8c8c, size: 0.8, distance: 10, speed: 0.04 },
      { name: 'Venus', color: 0xe6e6b8, size: 1.5, distance: 14, speed: 0.015 },
      { name: 'Earth', color: 0x4488ff, size: 1.6, distance: 20, speed: 0.01 },
      { name: 'Mars', color: 0xff4444, size: 1.2, distance: 26, speed: 0.008 },
      { name: 'Jupiter', color: 0xd4a574, size: 3.5, distance: 36, speed: 0.004 },
      { name: 'Saturn', color: 0xf4d03f, size: 3, distance: 48, speed: 0.003, hasRing: true },
      { name: 'Uranus', color: 0x4fd0e7, size: 2.2, distance: 60, speed: 0.002 },
      { name: 'Neptune', color: 0x4169e1, size: 2.1, distance: 72, speed: 0.001 }
    ];

    const planetMeshes = [];

    planets.forEach(planet => {
      const geometry = new THREE.SphereGeometry(planet.size, 32, 32);
      const material = new THREE.MeshStandardMaterial({ color: planet.color });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.x = planet.distance;
      scene.add(mesh);
      
      const orbitCurve = new THREE.EllipseCurve(0, 0, planet.distance, planet.distance, 0, Math.PI * 2, false, 0);
      const points = orbitCurve.getPoints(100);
      const orbitGeometry = new THREE.BufferGeometry().setFromPoints(points.map(p => new THREE.Vector3(p.x, 0, p.y)));
      const orbitMaterial = new THREE.LineBasicMaterial({ color: 0x444444, transparent: true, opacity: 0.3 });
      const orbit = new THREE.Line(orbitGeometry, orbitMaterial);
      scene.add(orbit);

      if (planet.hasRing) {
        const ringGeometry = new THREE.RingGeometry(planet.size * 1.4, planet.size * 2.2, 64);
        const ringMaterial = new THREE.MeshBasicMaterial({ 
          color: 0xc4a574, 
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.6
        });
        const ring = new THREE.Mesh(ringGeometry, ringMaterial);
        ring.rotation.x = Math.PI / 2.5;
        mesh.add(ring);
      }

      planetMeshes.push({ mesh, distance: planet.distance, speed: planet.speed, angle: Math.random() * Math.PI * 2 });
    });

    // Asteroid belt
    const asteroidCount = 200;
    const asteroidGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(asteroidCount * 3);
    
    for (let i = 0; i < asteroidCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const distance = 30 + Math.random() * 4;
      positions[i * 3] = Math.cos(angle) * distance;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 2;
      positions[i * 3 + 2] = Math.sin(angle) * distance;
    }
    
    asteroidGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const asteroidMaterial = new THREE.PointsMaterial({ color: 0x888888, size: 0.3 });
    const asteroids = new THREE.Points(asteroidGeometry, asteroidMaterial);
    scene.add(asteroids);

    // Stars
    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 3000;
    const starsPositions = new Float32Array(starsCount * 3);
    
    for (let i = 0; i < starsCount * 3; i++) {
      starsPositions[i] = (Math.random() - 0.5) * 400;
    }
    
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
    const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.8 });
    const stars = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(stars);

    // Animation
    let animationId;
    let time = 0;

    function animate() {
      animationId = requestAnimationFrame(animate);
      time += 0.005;

      sunGlow.rotation.y = time * 0.1;
      sunGlow.scale.setScalar(1 + Math.sin(time * 2) * 0.02);

      planetMeshes.forEach(planet => {
        planet.angle += planet.speed;
        planet.mesh.position.x = Math.cos(planet.angle) * planet.distance;
        planet.mesh.position.z = Math.sin(planet.angle) * planet.distance;
        planet.mesh.rotation.y += 0.01;
      });

      asteroids.rotation.y = time * 0.02;

      controls.update();
      renderer.render(scene, camera);
    }

    // Hide loading
    document.getElementById('loading').style.display = 'none';
    
    animate();

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Export functions for buttons
    window.resetView = () => {
      camera.position.set(0, 40, 80);
      controls.target.set(0, 0, 0);
    };

    window.toggleFullscreen = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hole Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #050508;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff6b35;
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulse 1.5s ease-in-out infinite;
            z-index: 100;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 50;
        }
        .btn {
            width: 44px;
            height: 44px;
            border: 1px solid rgba(255, 107, 53, 0.4);
            background: rgba(20, 20, 30, 0.7);
            color: #ff6b35;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        .btn:hover {
            background: rgba(255, 107, 53, 0.2);
            border-color: #ff6b35;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .title {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff6b35;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
            z-index: 50;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="canvas-container">
        <div id="loading">Loading...</div>
        <div class="title">Black Hole</div>
        <div class="controls">
            <button class="btn" id="resetBtn" title="Reset View">⟲</button>
            <button class="btn" id="fullscreenBtn" title="Fullscreen">⛶</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.FogExp2(0x050508, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 30;
        controls.maxPolarAngle = Math.PI / 1.5;

        // Black hole group
        const blackHoleGroup = new THREE.Group();
        scene.add(blackHoleGroup);

        // Event horizon (black sphere)
        const horizonGeometry = new THREE.SphereGeometry(1.5, 64, 64);
        const horizonMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x000000,
            transparent: true,
            opacity: 0.95
        });
        const eventHorizon = new THREE.Mesh(horizonGeometry, horizonMaterial);
        blackHoleGroup.add(eventHorizon);

        // Photon sphere (glow around black hole)
        const photonGeometry = new THREE.SphereGeometry(1.8, 64, 64);
        const photonMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                color: { value: new THREE.Color(0xff6b35) }
            },
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec3 color;
                varying vec3 vNormal;
                void main() {
                    float intensity = pow(0.6 - dot(vNormal, vec3(0, 0, 1.0)), 2.0);
                    float pulse = sin(time * 2.0) * 0.1 + 0.9;
                    gl_FragColor = vec4(color * intensity * pulse, intensity * 0.8);
                }
            `,
            transparent: true,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending
        });
        const photonSphere = new THREE.Mesh(photonGeometry, photonMaterial);
        blackHoleGroup.add(photonSphere);

        // Accretion disk
        const diskGroup = new THREE.Group();
        blackHoleGroup.add(diskGroup);

        // Inner accretion disk (bright)
        const innerDiskGeometry = new THREE.RingGeometry(2.5, 4, 128, 1);
        const innerDiskMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                innerColor: { value: new THREE.Color(0xffaa00) },
                outerColor: { value: new THREE.Color(0xff4400) }
            },
            vertexShader: `
                varying vec2 vUv;
                varying float vDistance;
                void main() {
                    vUv = uv;
                    vDistance = length(position.xy);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec3 innerColor;
                uniform vec3 outerColor;
                varying vec2 vUv;
                varying float vDistance;
                void main() {
                    float angle = vUv.x * 6.28318 + time * 0.5;
                    float spiral = sin(angle * 3.0 + vDistance * 2.0) * 0.5 + 0.5;
                    float radial = smoothstep(4.0, 2.5, vDistance);
                    float alpha = radial * (0.6 + spiral * 0.4);
                    vec3 color = mix(outerColor, innerColor, radial);
                    gl_FragColor = vec4(color * (1.0 + spiral * 0.5), alpha * 0.8);
                }
            `,
            transparent: true,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
        });
        const innerDisk = new THREE.Mesh(innerDiskGeometry, innerDiskMaterial);
        innerDisk.rotation.x = Math.PI / 2;
        diskGroup.add(innerDisk);

        // Outer accretion disk (dimmer)
        const outerDiskGeometry = new THREE.RingGeometry(4, 8, 128, 1);
        const outerDiskMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                color: { value: new THREE.Color(0xff6b35) }
            },
            vertexShader: `
                varying vec2 vUv;
                varying float vDistance;
                void main() {
                    vUv = uv;
                    vDistance = length(position.xy);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec3 color;
                varying vec2 vUv;
                varying float vDistance;
                void main() {
                    float angle = vUv.x * 6.28318 - time * 0.3;
                    float spiral = sin(angle * 2.0 + vDistance) * 0.5 + 0.5;
                    float radial = smoothstep(8.0, 4.0, vDistance) * smoothstep(4.0, 5.0, vDistance);
                    float alpha = radial * (0.3 + spiral * 0.3);
                    gl_FragColor = vec4(color * (0.5 + spiral * 0.5), alpha * 0.5);
                }
            `,
            transparent: true,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
        });
        const outerDisk = new THREE.Mesh(outerDiskGeometry, outerDiskMaterial);
        outerDisk.rotation.x = Math.PI / 2;
        diskGroup.add(outerDisk);

        // Accretion disk particles
        const particleCount = 2000;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleSpeeds = new Float32Array(particleCount);
        const particleDistances = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const distance = 2.5 + Math.random() * 6;
            const height = (Math.random() - 0.5) * 0.3 * (1 - (distance - 2.5) / 6);
            
            particlePositions[i * 3] = Math.cos(angle) * distance;
            particlePositions[i * 3 + 1] = height;
            particlePositions[i * 3 + 2] = Math.sin(angle) * distance;
            
            particleSpeeds[i] = 0.5 + Math.random() * 1.5;
            particleDistances[i] = distance;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        
        const particlesMaterial = new THREE.PointsMaterial({
            color: 0xffaa55,
            size: 0.08,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        diskGroup.add(particles);

        // Gravitational lensing effect (background stars)
        const starsGeometry = new THREE.BufferGeometry();
        const starCount = 3000;
        const starPositions = new Float32Array(starCount * 3);
        
        for (let i = 0; i < starCount; i++) {
            const radius = 15 + Math.random() * 50;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            
            starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            starPositions[i * 3 + 2] = radius * Math.cos(phi);
        }
        
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        
        const starsMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.05,
            transparent: true,
            opacity: 0.6
        });
        
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // Jet particles (relativistic jets)
        const jetCount = 500;
        const jetGeometry = new THREE.BufferGeometry();
        const jetPositions = new Float32Array(jetCount * 3);
        const jetVelocities = [];
        
        for (let i = 0; i < jetCount; i++) {
            const isTop = Math.random() > 0.5;
            const y = (Math.random() - 0.5) * 10;
            const radius = Math.abs(y) * 0.1 + Math.random() * 0.2;
            const angle = Math.random() * Math.PI * 2;
            
            jetPositions[i * 3] = Math.cos(angle) * radius;
            jetPositions[i * 3 + 1] = y;
            jetPositions[i * 3 + 2] = Math.sin(angle) * radius;
            
            jetVelocities.push({
                y: isTop ? 0.1 + Math.random() * 0.2 : -0.1 - Math.random() * 0.2,
                radius: radius,
                angle: angle
            });
        }
        
        jetGeometry.setAttribute('position', new THREE.BufferAttribute(jetPositions, 3));
        
        const jetMaterial = new THREE.PointsMaterial({
            color: 0x88ccff,
            size: 0.06,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        
        const jets = new THREE.Points(jetGeometry, jetMaterial);
        blackHoleGroup.add(jets);

        // Hide loading spinner
        document.getElementById('loading').style.display = 'none';

        // Animation
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();
            const delta = clock.getDelta();

            // Update shader uniforms
            photonMaterial.uniforms.time.value = time;
            innerDiskMaterial.uniforms.time.value = time;
            outerDiskMaterial.uniforms.time.value = time;

            // Rotate disks
            diskGroup.rotation.y = time * 0.1;

            // Animate particles
            const positions = particles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                const angle = Math.atan2(positions[i * 3 + 2], positions[i * 3]);
                const distance = particleDistances[i];
                const speed = particleSpeeds[i] * 0.5 / (distance * 0.3);
                const newAngle = angle + speed * 0.02;
                
                positions[i * 3] = Math.cos(newAngle) * distance;
                positions[i * 3 + 2] = Math.sin(newAngle) * distance;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            // Animate jets
            const jetPos = jets.geometry.attributes.position.array;
            for (let i = 0; i < jetCount; i++) {
                jetPos[i * 3 + 1] += jetVelocities[i].y;
                
                if (Math.abs(jetPos[i * 3 + 1]) > 8) {
                    jetPos[i * 3 + 1] = (Math.random() - 0.5) * 2;
                    const radius = Math.abs(jetPos[i * 3 + 1]) * 0.1 + Math.random() * 0.2;
                    const angle = Math.random() * Math.PI * 2;
                    jetPos[i * 3] = Math.cos(angle) * radius;
                    jetPos[i * 3 + 2] = Math.sin(angle) * radius;
                }
            }
            jets.geometry.attributes.position.needsUpdate = true;

            // Slowly rotate entire black hole group
            blackHoleGroup.rotation.y = time * 0.02;
            blackHoleGroup.rotation.z = Math.sin(time * 0.1) * 0.05;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Controls
        document.getElementById('resetBtn').addEventListener('click', () => {
            camera.position.set(0, 5, 12);
            controls.target.set(0, 0, 0);
            controls.update();
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

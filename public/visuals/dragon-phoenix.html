<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon & Phoenix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #080810;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulse 1.5s ease-in-out infinite;
            z-index: 100;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 50;
        }
        .btn {
            width: 44px;
            height: 44px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(20, 20, 30, 0.7);
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffffff;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .title {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
            z-index: 50;
        }
        .side-label {
            position: absolute;
            top: 50%;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.6;
            z-index: 50;
            transform: translateY(-50%);
        }
        .side-label.dragon {
            left: 20px;
            color: #00ffff;
        }
        .side-label.phoenix {
            right: 20px;
            color: #ff4400;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="canvas-container">
        <div id="loading">Summoning...</div>
        <div class="title">Dragon & Phoenix</div>
        <div class="side-label dragon">Dragon</div>
        <div class="side-label phoenix">Phoenix</div>
        <div class="controls">
            <button class="btn" id="resetBtn" title="Reset View">⟲</button>
            <button class="btn" id="fullscreenBtn" title="Fullscreen">⛶</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x080810);
        scene.fog = new THREE.FogExp2(0x080810, 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 12;
        controls.maxDistance = 50;

        // ============== DRAGON (Left side) ==============
        const dragonGroup = new THREE.Group();
        dragonGroup.position.x = -6;
        scene.add(dragonGroup);

        const dragonColors = [
            new THREE.Color(0x00ffff),
            new THREE.Color(0x00ccff),
            new THREE.Color(0x0088ff),
            new THREE.Color(0x0044ff),
            new THREE.Color(0x00ffcc)
        ];

        // Dragon body
        const dragonBodyCount = 2500;
        const dragonBodyGeo = new THREE.BufferGeometry();
        const dragonBodyPos = new Float32Array(dragonBodyCount * 3);
        const dragonBodyColors = new Float32Array(dragonBodyCount * 3);
        const dragonBodyData = [];

        for (let i = 0; i < dragonBodyCount; i++) {
            const t = i / dragonBodyCount;
            const angle = t * Math.PI * 6;
            const radius = 1 + Math.sin(t * Math.PI * 3) * 0.5;
            
            const x = Math.cos(angle) * radius * 0.8;
            const y = Math.sin(t * Math.PI * 2) * 2.5 + Math.sin(angle * 2) * 0.3;
            const z = Math.sin(angle) * radius * 0.8;
            
            dragonBodyPos[i * 3] = x;
            dragonBodyPos[i * 3 + 1] = y;
            dragonBodyPos[i * 3 + 2] = z;
            
            const color = dragonColors[Math.floor(t * dragonColors.length)];
            dragonBodyColors[i * 3] = color.r;
            dragonBodyColors[i * 3 + 1] = color.g;
            dragonBodyColors[i * 3 + 2] = color.b;
            
            dragonBodyData.push({ t, angle, originalX: x, originalY: y, originalZ: z });
        }

        dragonBodyGeo.setAttribute('position', new THREE.BufferAttribute(dragonBodyPos, 3));
        dragonBodyGeo.setAttribute('color', new THREE.BufferAttribute(dragonBodyColors, 3));

        const dragonBodyMat = new THREE.PointsMaterial({
            size: 0.12,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending
        });

        const dragonBody = new THREE.Points(dragonBodyGeo, dragonBodyMat);
        dragonGroup.add(dragonBody);

        // Dragon particles
        const dragonParticleCount = 800;
        const dragonParticleGeo = new THREE.BufferGeometry();
        const dragonParticlePos = new Float32Array(dragonParticleCount * 3);
        const dragonParticleData = [];

        for (let i = 0; i < dragonParticleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 2 + Math.random() * 5;
            const y = (Math.random() - 0.5) * 8;
            
            dragonParticlePos[i * 3] = Math.cos(angle) * radius;
            dragonParticlePos[i * 3 + 1] = y;
            dragonParticlePos[i * 3 + 2] = Math.sin(angle) * radius;
            
            dragonParticleData.push({ angle, radius, speed: 0.3 + Math.random() * 0.4 });
        }

        dragonParticleGeo.setAttribute('position', new THREE.BufferAttribute(dragonParticlePos, 3));

        const dragonParticleMat = new THREE.PointsMaterial({
            color: 0x00ffff,
            size: 0.06,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending
        });

        const dragonParticles = new THREE.Points(dragonParticleGeo, dragonParticleMat);
        dragonGroup.add(dragonParticles);

        // ============== PHOENIX (Right side) ==============
        const phoenixGroup = new THREE.Group();
        phoenixGroup.position.x = 6;
        scene.add(phoenixGroup);

        const phoenixColors = [
            new THREE.Color(0xff0000),
            new THREE.Color(0xff4400),
            new THREE.Color(0xff8800),
            new THREE.Color(0xffaa00),
            new THREE.Color(0xffff00)
        ];

        // Phoenix body
        const phoenixBodyCount = 2500;
        const phoenixBodyGeo = new THREE.BufferGeometry();
        const phoenixBodyPos = new Float32Array(phoenixBodyCount * 3);
        const phoenixBodyColors = new Float32Array(phoenixBodyCount * 3);
        const phoenixBodyData = [];

        for (let i = 0; i < phoenixBodyCount; i++) {
            const t = i / phoenixBodyCount;
            const angle = t * Math.PI * 5;
            const radius = 0.8 + Math.sin(t * Math.PI) * 1.2;
            
            const x = Math.cos(angle) * radius * (1 - t * 0.2);
            const y = t * 6 - 3 + Math.sin(angle * 2) * 0.4;
            const z = Math.sin(angle) * radius * (1 - t * 0.2);
            
            phoenixBodyPos[i * 3] = x;
            phoenixBodyPos[i * 3 + 1] = y;
            phoenixBodyPos[i * 3 + 2] = z;
            
            const color = phoenixColors[Math.floor(t * phoenixColors.length)];
            phoenixBodyColors[i * 3] = color.r;
            phoenixBodyColors[i * 3 + 1] = color.g;
            phoenixBodyColors[i * 3 + 2] = color.b;
            
            phoenixBodyData.push({ t, angle, originalX: x, originalY: y, originalZ: z });
        }

        phoenixBodyGeo.setAttribute('position', new THREE.BufferAttribute(phoenixBodyPos, 3));
        phoenixBodyGeo.setAttribute('color', new THREE.BufferAttribute(phoenixBodyColors, 3));

        const phoenixBodyMat = new THREE.PointsMaterial({
            size: 0.12,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending
        });

        const phoenixBody = new THREE.Points(phoenixBodyGeo, phoenixBodyMat);
        phoenixGroup.add(phoenixBody);

        // Phoenix wings
        const wingCount = 1500;
        const wingGeo = new THREE.BufferGeometry();
        const wingPos = new Float32Array(wingCount * 3);
        const wingColors = new Float32Array(wingCount * 3);
        const wingData = [];

        for (let i = 0; i < wingCount; i++) {
            const isLeft = i < wingCount / 2;
            const t = (i % (wingCount / 2)) / (wingCount / 2);
            
            const span = 5;
            const curve = Math.sin(t * Math.PI) * 2;
            const x = (isLeft ? -1 : 1) * (1 + t * span);
            const y = 1 + curve + Math.random() * 1.5;
            const z = Math.sin(t * Math.PI * 2) * 1 + (Math.random() - 0.5) * 0.5;
            
            wingPos[i * 3] = x;
            wingPos[i * 3 + 1] = y;
            wingPos[i * 3 + 2] = z;
            
            const color = phoenixColors[Math.floor(t * phoenixColors.length)];
            wingColors[i * 3] = color.r;
            wingColors[i * 3 + 1] = color.g;
            wingColors[i * 3 + 2] = color.b;
            
            wingData.push({ isLeft, originalX: x, originalY: y, originalZ: z, t });
        }

        wingGeo.setAttribute('position', new THREE.BufferAttribute(wingPos, 3));
        wingGeo.setAttribute('color', new THREE.BufferAttribute(wingColors, 3));

        const wingMat = new THREE.PointsMaterial({
            size: 0.1,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const wings = new THREE.Points(wingGeo, wingMat);
        phoenixGroup.add(wings);

        // Phoenix embers
        const emberCount = 600;
        const emberGeo = new THREE.BufferGeometry();
        const emberPos = new Float32Array(emberCount * 3);
        const emberData = [];

        for (let i = 0; i < emberCount; i++) {
            emberPos[i * 3] = (Math.random() - 0.5) * 10;
            emberPos[i * 3 + 1] = -6 + Math.random() * 12;
            emberPos[i * 3 + 2] = (Math.random() - 0.5) * 5;
            
            emberData.push({ speed: 0.02 + Math.random() * 0.04 });
        }

        emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPos, 3));

        const emberMat = new THREE.PointsMaterial({
            color: 0xff6600,
            size: 0.07,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });

        const embers = new THREE.Points(emberGeo, emberMat);
        phoenixGroup.add(embers);

        // ============== CENTER ENERGY ==============
        // Connecting energy between dragon and phoenix
        const energyCount = 500;
        const energyGeo = new THREE.BufferGeometry();
        const energyPos = new Float32Array(energyCount * 3);
        const energyColors = new Float32Array(energyCount * 3);
        const energyData = [];

        for (let i = 0; i < energyCount; i++) {
            const t = Math.random();
            const spread = Math.random() * 3;
            
            energyPos[i * 3] = (Math.random() - 0.5) * 2;
            energyPos[i * 3 + 1] = (Math.random() - 0.5) * 8;
            energyPos[i * 3 + 2] = (Math.random() - 0.5) * spread;
            
            // Gradient from cyan to orange
            const color = new THREE.Color();
            if (Math.random() > 0.5) {
                color.setHSL(0.5 + Math.random() * 0.1, 1, 0.5); // Blue-cyan
            } else {
                color.setHSL(0.05 + Math.random() * 0.1, 1, 0.5); // Orange-red
            }
            energyColors[i * 3] = color.r;
            energyColors[i * 3 + 1] = color.g;
            energyColors[i * 3 + 2] = color.b;
            
            energyData.push({ 
                baseX: energyPos[i * 3], 
                speed: 0.5 + Math.random(),
                phase: Math.random() * Math.PI * 2
            });
        }

        energyGeo.setAttribute('position', new THREE.BufferAttribute(energyPos, 3));
        energyGeo.setAttribute('color', new THREE.BufferAttribute(energyColors, 3));

        const energyMat = new THREE.PointsMaterial({
            size: 0.08,
            vertexColors: true,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending
        });

        const energyParticles = new THREE.Points(energyGeo, energyMat);
        scene.add(energyParticles);

        // Lights
        const dragonLight = new THREE.PointLight(0x00ffff, 1.2, 15);
        dragonLight.position.set(-6, 0, 0);
        scene.add(dragonLight);

        const phoenixLight = new THREE.PointLight(0xff4400, 1.2, 15);
        phoenixLight.position.set(6, 0, 0);
        scene.add(phoenixLight);

        const centerLight = new THREE.PointLight(0xff00ff, 0.8, 10);
        centerLight.position.set(0, 0, 2);
        scene.add(centerLight);

        // Hide loading spinner
        document.getElementById('loading').style.display = 'none';

        // Animation
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();

            // Animate dragon
            const dragonPos = dragonBody.geometry.attributes.position.array;
            for (let i = 0; i < dragonBodyCount; i++) {
                const data = dragonBodyData[i];
                const undulation = Math.sin(time * 1.5 + data.t * 6) * 0.2;
                
                dragonPos[i * 3] = data.originalX + undulation * Math.cos(data.angle);
                dragonPos[i * 3 + 1] = data.originalY + Math.cos(time * 2 + data.t * 8) * 0.1;
                dragonPos[i * 3 + 2] = data.originalZ + undulation * Math.sin(data.angle);
            }
            dragonBody.geometry.attributes.position.needsUpdate = true;

            // Animate dragon particles
            const dParticles = dragonParticles.geometry.attributes.position.array;
            for (let i = 0; i < dragonParticleCount; i++) {
                const data = dragonParticleData[i];
                data.angle += data.speed * 0.01;
                
                dParticles[i * 3] = Math.cos(data.angle) * data.radius;
                dParticles[i * 3 + 2] = Math.sin(data.angle) * data.radius;
            }
            dragonParticles.geometry.attributes.position.needsUpdate = true;

            // Animate phoenix body
            const phoenixPos = phoenixBody.geometry.attributes.position.array;
            for (let i = 0; i < phoenixBodyCount; i++) {
                const data = phoenixBodyData[i];
                const wave = Math.sin(time * 2 + data.t * 5) * 0.15;
                
                phoenixPos[i * 3] = data.originalX + wave;
                phoenixPos[i * 3 + 1] = data.originalY + Math.sin(time * 1.5 + data.angle) * 0.08;
                phoenixPos[i * 3 + 2] = data.originalZ + wave * 0.5;
            }
            phoenixBody.geometry.attributes.position.needsUpdate = true;

            // Animate phoenix wings
            const wingPos = wings.geometry.attributes.position.array;
            const flap = Math.sin(time * 3) * 0.25;
            
            for (let i = 0; i < wingCount; i++) {
                const data = wingData[i];
                const wingFlap = flap * (1 - Math.abs(data.originalX) / 6);
                
                wingPos[i * 3 + 1] = data.originalY + wingFlap;
                wingPos[i * 3 + 2] = data.originalZ + wingFlap * 0.3;
            }
            wings.geometry.attributes.position.needsUpdate = true;

            // Animate embers
            const emberPositions = embers.geometry.attributes.position.array;
            for (let i = 0; i < emberCount; i++) {
                emberPositions[i * 3 + 1] += emberData[i].speed;
                
                if (emberPositions[i * 3 + 1] > 6) {
                    emberPositions[i * 3 + 1] = -6;
                }
            }
            embers.geometry.attributes.position.needsUpdate = true;

            // Animate center energy
            const energyPos = energyParticles.geometry.attributes.position.array;
            for (let i = 0; i < energyCount; i++) {
                const data = energyData[i];
                const flow = Math.sin(time * data.speed + data.phase) * 2;
                
                energyPos[i * 3] = data.baseX + flow;
            }
            energyParticles.geometry.attributes.position.needsUpdate = true;

            // Rotate groups slowly
            dragonGroup.rotation.y = time * 0.08;
            phoenixGroup.rotation.y = -time * 0.08;

            // Pulse lights
            dragonLight.intensity = 1 + Math.sin(time * 2.5) * 0.3;
            phoenixLight.intensity = 1 + Math.sin(time * 3 + 1) * 0.3;
            centerLight.intensity = 0.6 + Math.sin(time * 4) * 0.2;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Controls
        document.getElementById('resetBtn').addEventListener('click', () => {
            camera.position.set(0, 2, 25);
            controls.target.set(0, 0, 0);
            controls.update();
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

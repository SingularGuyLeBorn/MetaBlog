<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eastern Dragon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #050a14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulse 1.5s ease-in-out infinite;
            z-index: 100;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 50;
        }
        .btn {
            width: 44px;
            height: 44px;
            border: 1px solid rgba(0, 255, 255, 0.4);
            background: rgba(10, 20, 30, 0.7);
            color: #00ffff;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        .btn:hover {
            background: rgba(0, 255, 255, 0.2);
            border-color: #00ffff;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .title {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffff;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
            z-index: 50;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="canvas-container">
        <div id="loading">Awakening...</div>
        <div class="title">Eastern Dragon</div>
        <div class="controls">
            <button class="btn" id="resetBtn" title="Reset View">⟲</button>
            <button class="btn" id="fullscreenBtn" title="Fullscreen">⛶</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050a14);
        scene.fog = new THREE.FogExp2(0x050a14, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 10;
        controls.maxDistance = 50;
        controls.maxPolarAngle = Math.PI / 1.8;

        // Dragon group
        const dragonGroup = new THREE.Group();
        scene.add(dragonGroup);

        // Dragon colors
        const dragonColors = [
            new THREE.Color(0x00ffff),  // Cyan
            new THREE.Color(0x00ccff),  // Light blue
            new THREE.Color(0x0088ff),  // Blue
            new THREE.Color(0x0044ff),  // Deep blue
            new THREE.Color(0x00ffcc),  // Turquoise
            new THREE.Color(0x88ffff)   // Light cyan
        ];

        // Dragon body particles - serpentine form
        const bodyParticleCount = 4000;
        const bodyGeometry = new THREE.BufferGeometry();
        const bodyPositions = new Float32Array(bodyParticleCount * 3);
        const bodyColors = new Float32Array(bodyParticleCount * 3);
        const bodySizes = new Float32Array(bodyParticleCount);
        const bodyData = [];

        for (let i = 0; i < bodyParticleCount; i++) {
            // Create serpentine dragon body
            const t = i / bodyParticleCount;
            const segments = 20;
            const segment = Math.floor(t * segments);
            const segmentT = (t * segments) % 1;
            
            // Main body curve
            const angle = t * Math.PI * 8;
            const radius = 1.5 + Math.sin(t * Math.PI * 4) * 0.8;
            
            // Eastern dragon body undulation
            const x = Math.cos(angle) * radius * (1 + Math.sin(t * Math.PI * 3) * 0.3);
            const y = Math.sin(t * Math.PI * 2) * 3 + Math.sin(angle * 2) * 0.5;
            const z = Math.sin(angle) * radius * (1 + Math.cos(t * Math.PI * 2) * 0.3);
            
            bodyPositions[i * 3] = x;
            bodyPositions[i * 3 + 1] = y;
            bodyPositions[i * 3 + 2] = z;
            
            // Color based on position along body
            const colorIndex = Math.floor(t * dragonColors.length);
            const color = dragonColors[Math.min(colorIndex, dragonColors.length - 1)];
            bodyColors[i * 3] = color.r;
            bodyColors[i * 3 + 1] = color.g;
            bodyColors[i * 3 + 2] = color.b;
            
            // Size varies along body - thicker in middle
            const thickness = Math.sin(t * Math.PI) * 0.15 + 0.08;
            bodySizes[i] = thickness + Math.random() * 0.05;
            
            bodyData.push({
                t: t,
                angle: angle,
                baseRadius: radius,
                phase: Math.random() * Math.PI * 2,
                originalX: x,
                originalY: y,
                originalZ: z
            });
        }

        bodyGeometry.setAttribute('position', new THREE.BufferAttribute(bodyPositions, 3));
        bodyGeometry.setAttribute('color', new THREE.BufferAttribute(bodyColors, 3));
        bodyGeometry.setAttribute('size', new THREE.BufferAttribute(bodySizes, 1));

        const bodyMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 }
            },
            vertexShader: `
                attribute float size;
                attribute vec3 color;
                varying vec3 vColor;
                uniform float time;
                void main() {
                    vColor = color;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (400.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                void main() {
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if (dist > 0.5) discard;
                    float alpha = 1.0 - smoothstep(0.0, 0.5, dist);
                    float glow = 1.0 - dist * 1.5;
                    gl_FragColor = vec4(vColor * (0.8 + glow * 0.4), alpha);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const bodyParticles = new THREE.Points(bodyGeometry, bodyMaterial);
        dragonGroup.add(bodyParticles);

        // Dragon scales (larger particles)
        const scaleCount = 800;
        const scaleGeometry = new THREE.BufferGeometry();
        const scalePositions = new Float32Array(scaleCount * 3);
        const scaleColors = new Float32Array(scaleCount * 3);
        const scaleData = [];

        for (let i = 0; i < scaleCount; i++) {
            const t = i / scaleCount;
            const angle = t * Math.PI * 8;
            const radius = 1.5 + Math.sin(t * Math.PI * 4) * 0.8;
            
            // Offset scales from body center
            const offset = 0.3 + Math.random() * 0.2;
            const x = Math.cos(angle) * (radius + offset);
            const y = Math.sin(t * Math.PI * 2) * 3 + Math.sin(angle * 2) * 0.5 + (Math.random() - 0.5) * 0.5;
            const z = Math.sin(angle) * (radius + offset);
            
            scalePositions[i * 3] = x;
            scalePositions[i * 3 + 1] = y;
            scalePositions[i * 3 + 2] = z;
            
            const color = dragonColors[Math.floor(Math.random() * dragonColors.length)];
            scaleColors[i * 3] = color.r;
            scaleColors[i * 3 + 1] = color.g;
            scaleColors[i * 3 + 2] = color.b;
            
            scaleData.push({
                t: t,
                offset: offset,
                phase: Math.random() * Math.PI * 2
            });
        }

        scaleGeometry.setAttribute('position', new THREE.BufferAttribute(scalePositions, 3));
        scaleGeometry.setAttribute('color', new THREE.BufferAttribute(scaleColors, 3));

        const scaleMaterial = new THREE.PointsMaterial({
            size: 0.2,
            vertexColors: true,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending
        });

        const scales = new THREE.Points(scaleGeometry, scaleMaterial);
        dragonGroup.add(scales);

        // Dragon whiskers
        const whiskerCount = 600;
        const whiskerGeometry = new THREE.BufferGeometry();
        const whiskerPositions = new Float32Array(whiskerCount * 3);
        const whiskerColors = new Float32Array(whiskerCount * 3);
        const whiskerData = [];

        for (let i = 0; i < whiskerCount; i++) {
            const isLeft = i < whiskerCount / 2;
            const t = (i % (whiskerCount / 2)) / (whiskerCount / 2);
            
            // Whiskers extend from head area
            const baseX = isLeft ? -2 : 2;
            const length = 4 + t * 3;
            const wave = Math.sin(t * Math.PI * 3) * 0.5;
            
            const x = baseX + (isLeft ? -1 : 1) * length * 0.3;
            const y = 2 + t * 2 + wave;
            const z = 3 + t + Math.sin(t * Math.PI * 2) * 0.5;
            
            whiskerPositions[i * 3] = x;
            whiskerPositions[i * 3 + 1] = y;
            whiskerPositions[i * 3 + 2] = z;
            
            const color = dragonColors[0]; // Bright cyan for whiskers
            whiskerColors[i * 3] = color.r;
            whiskerColors[i * 3 + 1] = color.g;
            whiskerColors[i * 3 + 2] = color.b;
            
            whiskerData.push({
                isLeft: isLeft,
                t: t,
                phase: Math.random() * Math.PI * 2
            });
        }

        whiskerGeometry.setAttribute('position', new THREE.BufferAttribute(whiskerPositions, 3));
        whiskerGeometry.setAttribute('color', new THREE.BufferAttribute(whiskerColors, 3));

        const whiskerMaterial = new THREE.PointsMaterial({
            size: 0.1,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const whiskers = new THREE.Points(whiskerGeometry, whiskerMaterial);
        dragonGroup.add(whiskers);

        // Water/energy particles around dragon
        const waterCount = 1500;
        const waterGeometry = new THREE.BufferGeometry();
        const waterPositions = new Float32Array(waterCount * 3);
        const waterColors = new Float32Array(waterCount * 3);
        const waterData = [];

        for (let i = 0; i < waterCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 3 + Math.random() * 8;
            const height = (Math.random() - 0.5) * 12;
            
            waterPositions[i * 3] = Math.cos(angle) * radius;
            waterPositions[i * 3 + 1] = height;
            waterPositions[i * 3 + 2] = Math.sin(angle) * radius;
            
            const color = dragonColors[Math.floor(Math.random() * dragonColors.length)];
            waterColors[i * 3] = color.r;
            waterColors[i * 3 + 1] = color.g;
            waterColors[i * 3 + 2] = color.b;
            
            waterData.push({
                angle: angle,
                radius: radius,
                speed: 0.2 + Math.random() * 0.5,
                ySpeed: (Math.random() - 0.5) * 0.02
            });
        }

        waterGeometry.setAttribute('position', new THREE.BufferAttribute(waterPositions, 3));
        waterGeometry.setAttribute('color', new THREE.BufferAttribute(waterColors, 3));

        const waterMaterial = new THREE.PointsMaterial({
            size: 0.06,
            vertexColors: true,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending
        });

        const waterParticles = new THREE.Points(waterGeometry, waterMaterial);
        scene.add(waterParticles);

        // Dragon horn (using cone geometry)
        const hornGeometry = new THREE.ConeGeometry(0.15, 1.5, 16);
        const hornMaterial = new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            transparent: true,
            opacity: 0.8
        });
        
        const leftHorn = new THREE.Mesh(hornGeometry, hornMaterial);
        leftHorn.position.set(-1, 3, 2.5);
        leftHorn.rotation.z = 0.3;
        leftHorn.rotation.x = -0.2;
        dragonGroup.add(leftHorn);
        
        const rightHorn = new THREE.Mesh(hornGeometry, hornMaterial);
        rightHorn.position.set(1, 3, 2.5);
        rightHorn.rotation.z = -0.3;
        rightHorn.rotation.x = -0.2;
        dragonGroup.add(rightHorn);

        // Energy glow lights
        const dragonLight1 = new THREE.PointLight(0x00ffff, 1.5, 15);
        dragonLight1.position.set(0, 0, 0);
        dragonGroup.add(dragonLight1);

        const dragonLight2 = new THREE.PointLight(0x0088ff, 1, 10);
        dragonLight2.position.set(-2, 2, 2);
        dragonGroup.add(dragonLight2);

        const dragonLight3 = new THREE.PointLight(0x0088ff, 1, 10);
        dragonLight3.position.set(2, -2, -2);
        dragonGroup.add(dragonLight3);

        // Hide loading spinner
        document.getElementById('loading').style.display = 'none';

        // Animation
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();

            // Update shader uniforms
            bodyMaterial.uniforms.time.value = time;

            // Animate body (serpentine movement)
            const bodyPos = bodyParticles.geometry.attributes.position.array;
            for (let i = 0; i < bodyParticleCount; i++) {
                const data = bodyData[i];
                const undulation = Math.sin(time * 1.5 + data.t * 8) * 0.3;
                const secondaryWave = Math.cos(time * 2 + data.t * 12) * 0.15;
                
                const newX = data.originalX + undulation * Math.cos(data.angle);
                const newZ = data.originalZ + undulation * Math.sin(data.angle);
                const newY = data.originalY + secondaryWave;
                
                bodyPos[i * 3] = newX;
                bodyPos[i * 3 + 1] = newY;
                bodyPos[i * 3 + 2] = newZ;
            }
            bodyParticles.geometry.attributes.position.needsUpdate = true;

            // Animate scales
            const scalePos = scales.geometry.attributes.position.array;
            for (let i = 0; i < scaleCount; i++) {
                const data = scaleData[i];
                const angle = data.t * Math.PI * 8 + time * 0.5;
                const radius = 1.5 + Math.sin(data.t * Math.PI * 4 + time * 0.3) * 0.8;
                
                const undulation = Math.sin(time * 1.5 + data.t * 8) * 0.3;
                
                scalePos[i * 3] = Math.cos(angle) * (radius + data.offset) + undulation * Math.cos(angle);
                scalePos[i * 3 + 1] = Math.sin(data.t * Math.PI * 2) * 3 + Math.sin(angle * 2) * 0.5 + Math.cos(time * 2 + data.t * 12) * 0.15;
                scalePos[i * 3 + 2] = Math.sin(angle) * (radius + data.offset) + undulation * Math.sin(angle);
            }
            scales.geometry.attributes.position.needsUpdate = true;

            // Animate whiskers
            const whiskerPos = whiskers.geometry.attributes.position.array;
            for (let i = 0; i < whiskerCount; i++) {
                const data = whiskerData[i];
                const wave1 = Math.sin(time * 3 + data.t * 5 + data.phase) * 0.3;
                const wave2 = Math.cos(time * 2 + data.t * 3) * 0.2;
                
                const baseX = data.isLeft ? -2 : 2;
                const length = 4 + data.t * 3;
                
                whiskerPos[i * 3] = baseX + (data.isLeft ? -1 : 1) * length * 0.3 + wave1;
                whiskerPos[i * 3 + 1] = 2 + data.t * 2 + wave2;
                whiskerPos[i * 3 + 2] = 3 + data.t + Math.sin(data.t * Math.PI * 2 + time) * 0.5;
            }
            whiskers.geometry.attributes.position.needsUpdate = true;

            // Animate water particles
            const waterPos = waterParticles.geometry.attributes.position.array;
            for (let i = 0; i < waterCount; i++) {
                const data = waterData[i];
                data.angle += data.speed * 0.01;
                
                waterPos[i * 3] = Math.cos(data.angle) * data.radius;
                waterPos[i * 3 + 1] += data.ySpeed;
                waterPos[i * 3 + 2] = Math.sin(data.angle) * data.radius;
                
                if (Math.abs(waterPos[i * 3 + 1]) > 8) {
                    waterPos[i * 3 + 1] *= -0.8;
                }
            }
            waterParticles.geometry.attributes.position.needsUpdate = true;

            // Rotate dragon slowly
            dragonGroup.rotation.y = time * 0.1;

            // Pulse lights
            dragonLight1.intensity = 1.2 + Math.sin(time * 3) * 0.3;
            dragonLight2.intensity = 0.8 + Math.sin(time * 2.5 + 1) * 0.2;
            dragonLight3.intensity = 0.8 + Math.sin(time * 2.5 + 2) * 0.2;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Controls
        document.getElementById('resetBtn').addEventListener('click', () => {
            camera.position.set(0, 3, 22);
            controls.target.set(0, 0, 0);
            controls.update();
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
